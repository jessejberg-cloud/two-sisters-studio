# Builds the girls' tablet app (tablet-app/) whenever it changes, and puts the finished app on the site
# (site-src/assets/app/two-sisters-studio.apk), so a parent can download it on the tablet after logging in.
name: Tablet app
on:
  push:
    branches: [main]
    paths: ['tablet-app/**', '.github/workflows/tablet-app.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      - name: Build
        run: gradle -p tablet-app assembleRelease --no-daemon
      - name: Put the app on the site
        run: |
          mkdir -p site-src/assets/app
          cp tablet-app/app/build/outputs/apk/release/app-release.apk site-src/assets/app/two-sisters-studio.apk
          git config user.name "tablet-app build"
          git config user.email "actions@users.noreply.github.com"
          git add site-src/assets/app/two-sisters-studio.apk
          git diff --cached --quiet || git commit -m "Tablet app: new build"
          git push
