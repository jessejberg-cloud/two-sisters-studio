# Netlify builds the site from source on every push.
#   main -> the live site; other branches / pull requests -> preview links.
#   The audit runs too: if it finds a problem (like a last name), the deploy stops and the old site stays up.
[build]
  command = "node tools/build.cjs && node tools/audit.cjs"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Unlisted: ask every search engine and crawler not to index, follow, cache or preview anything.
# Content-Security-Policy only allows files from this site, so no third-party scripts,
# fonts, trackers or embeds can load even by accident.
[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive, nosnippet, noimageindex, notranslate"
    Referrer-Policy = "no-referrer"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=(), browsing-topics=()"
    Content-Security-Policy = "default-src 'self'; img-src 'self' data:; media-src 'self'; style-src 'self'; script-src 'self'; font-src 'self'; connect-src 'none'; form-action 'none'; frame-ancestors 'none'; base-uri 'self'; object-src 'none'"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
